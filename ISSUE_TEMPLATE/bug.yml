name: Bug report
description: Report a reproducible defect
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and revision
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and relevant contract
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
    validations:
      required: true
